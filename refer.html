<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol — You've Been Invited</title>
    <meta name="description" content="Join Protocol — the discipline-focused fitness app. AI meal scanning, workout tracking, and real coaching.">
    <meta property="og:title" content="Protocol — You've Been Invited">
    <meta property="og:description" content="Join Protocol — the discipline-focused fitness app.">
    <meta property="og:image" content="/og-image.png">
    <meta name="apple-itunes-app" content="app-id=6756283460">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #3ECFD4;
            --accent-light: #5ED9DD;
            --accent-glow: rgba(62, 207, 212, 0.5);
            --accent-dim: rgba(62, 207, 212, 0.12);
            --text: #fff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-subtle: rgba(255, 255, 255, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient background effects */
        .bg-glow {
            position: fixed;
            top: -40%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(62, 207, 212, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-bottom {
            position: fixed;
            bottom: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(62, 207, 212, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        /* Logo */
        .logo {
            width: 220px;
            height: auto;
            margin-bottom: 48px;
            opacity: 0;
            transform: translateY(-10px);
            animation: fadeDown 0.8s ease forwards;
        }

        @keyframes fadeDown {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Invite badge */
        .invite-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-dim);
            border: 1px solid rgba(62, 207, 212, 0.2);
            border-radius: 100px;
            padding: 10px 24px;
            margin-bottom: 36px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        .invite-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .invite-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* Headline */
        .headline {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.6s ease 0.45s forwards;
        }

        .headline span {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Subtext */
        .subtext {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.6s ease 0.6s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* CTA Button */
        .cta-wrapper {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.6s ease 0.75s forwards;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 16px 36px;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 30px rgba(62, 207, 212, 0.25), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(62, 207, 212, 0.35), 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .cta:active { transform: scale(0.97); }

        .cta svg {
            width: 20px;
            height: 20px;
        }

        /* Features row */
        .features {
            display: flex;
            gap: 32px;
            margin-top: 56px;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.9s forwards;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feature-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feature-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-subtle);
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-subtle);
            letter-spacing: 0.3px;
        }

        .footer a {
            color: var(--text-subtle);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .logo { width: 180px; margin-bottom: 36px; }
            .features { gap: 24px; }
            .cta { padding: 14px 28px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-bottom"></div>
    <div class="grid-bg"></div>

    <div class="container">
        <img class="logo" src="/logo.png" alt="Protocol">

        <div class="invite-badge">
            <div class="invite-dot"></div>
            <span class="invite-text" id="referralTag">Loading…</span>
        </div>

        <h1 class="headline">Your structured path<br>to <span>real results</span></h1>

        <p class="subtext">
            AI-powered meal scanning, guided workouts, and coaching built around discipline — not shortcuts.
        </p>

        <div class="cta-wrapper">
            <a class="cta" id="downloadBtn" href="https://apps.apple.com/app/protocol-compliance-engine/id6756283460">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 21.99 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.1 21.99C7.79 22.03 6.8 20.68 5.96 19.47C4.25 16.97 2.94 12.45 4.7 9.39C5.57 7.87 7.13 6.91 8.82 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5ZM13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/>
                </svg>
                Download on the App Store
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M23 6l-9.5 9.5-5-5L1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <span class="feature-label">AI Tracking</span>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                </div>
                <span class="feature-label">Workouts</span>
            </div>
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>
                </div>
                <span class="feature-label">Coaching</span>
            </div>
        </div>
    </div>

    <div class="footer">
        Your referral will be applied automatically &middot; <a href="/privacy.html">Privacy</a>
    </div>

    <script>
        (function() {
            var parts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
            var handle = '';
            if (parts.length >= 2 && (parts[0] === 'refer' || parts[0] === 'r')) {
                handle = decodeURIComponent(parts[1]).toLowerCase().trim();
            }

            if (!handle) {
                document.getElementById('referralTag').textContent = 'INVALID REFERRAL LINK';
                return;
            }

            document.getElementById('referralTag').textContent = 'INVITED BY @' + handle.toUpperCase();

            // Update Smart App Banner meta tag with deep link argument
            var metaTag = document.querySelector('meta[name="apple-itunes-app"]');
            if (metaTag) {
                var appId = metaTag.getAttribute('content').match(/app-id=(\d+)/);
                var id = appId ? appId[1] : '6756283460';
                metaTag.setAttribute('content',
                    'app-id=' + id + ', app-argument=protocol://refer?code=' + handle
                );
            }

            // Store referral code in localStorage
            try {
                localStorage.setItem('protocol_referral_code', handle);
                localStorage.setItem('protocol_referral_ts', new Date().toISOString());
            } catch(e) {}

            // Copy to clipboard for deferred deep link pickup
            try {
                navigator.clipboard.writeText('ref:' + handle).catch(function() {});
            } catch(e) {}

            // Track the click on the backend (fire-and-forget)
            var API_BASE = 'https://protocol-ai-backend-136ff028e7cc.herokuapp.com';
            try {
                fetch(API_BASE + '/referral/click/' + encodeURIComponent(handle), { method: 'POST' });
            } catch(e) {}

            // Try to open the app directly via custom URL scheme
            window.location.href = 'protocol://refer?code=' + handle;
        })();
    </script>
</body>
</html>
